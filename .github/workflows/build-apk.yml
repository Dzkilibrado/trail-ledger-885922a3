name: Build Android APK

# Sob demanda: roda quando você clicar em "Run workflow" no GitHub Actions,
# ou automaticamente ao criar uma tag de versão (ex: v1.0.0).
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Versão exibida no app (ex: 1.0.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar pasta webDir do Capacitor
        run: test -f capacitor-www/index.html

      - name: Adicionar/sincronizar plataforma Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build do APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: trailbook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
