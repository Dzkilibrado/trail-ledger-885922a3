name: Build Android APK

# Sob demanda: roda quando você clicar em "Run workflow" no GitHub Actions,
# ou automaticamente ao criar uma tag de versão (ex: v1.0.0).
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Versão exibida no app (ex: 1.0.0). Deixe em branco para usar a do package.json"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar pasta webDir do Capacitor
        run: test -f capacitor-www/index.html

      - name: Adicionar/sincronizar plataforma Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Aplicar ícone do app
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor "#1a1815" --iconBackgroundColorDark "#1a1815"

      - name: Definir nome e número da versão
        run: |
          VERSION_NAME="${{ github.event.inputs.versionName }}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(node -p "require('./package.json').version")
          fi
          VERSION_CODE=${{ github.run_number }}
          echo "Versao: $VERSION_NAME ($VERSION_CODE)"
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle

      - name: Usar keystore de debug fixo (evita precisar desinstalar a cada build)
        run: |
          mkdir -p ~/.android
          cp android-assets/debug.keystore ~/.android/debug.keystore

      - name: Build do APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: trailbook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
