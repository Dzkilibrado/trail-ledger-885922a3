<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TrailBook</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1a1815;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f4f0e8;
      }
      .loader {
        text-align: center;
      }
      .dot {
        width: 10px;
        height: 10px;
        margin: 0 4px;
        display: inline-block;
        border-radius: 50%;
        background: #f97316;
        animation: pulse 1.2s infinite ease-in-out;
      }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!--
      Este arquivo é apenas o fallback local do Capacitor.
      Em uso normal, o app carrega https://www.trailbook.com.br
      (definido em server.url no capacitor.config.ts) antes mesmo
      desta tela aparecer por muito tempo.
    -->
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </body>
</html>
